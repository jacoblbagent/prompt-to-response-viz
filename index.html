<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt &rarr; Response</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/@fontsource/instrument-sans@5.0.19/index.css');
@import url('https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.19/index.css');

:root{
  --bg:#0d1117;
  --panel:#161b22;
  --panel2:#1b2129;
  --line:#242a31;
  --ink:#e6edf3;
  --muted:#8b949e;
  --dim:#57616c;

  --accent:#58a6ff;   /* everything structural */
  --hot:#e3b341;      /* the one token being generated */
  --bad:#f85149;

  --mono:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Instrument Sans','Segoe UI',Helvetica,Arial,sans-serif;
  --r:6px;
}

*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:14px;line-height:1.5;
  height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;
}
::selection{background:#1f6feb55;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
button{font:inherit;color:inherit;cursor:pointer;}
.mono{font-family:var(--mono);}
.num{font-variant-numeric:tabular-nums;}

.app{width:100vw;height:100vh;display:flex;flex-direction:column;}

/* ---------------- header ---------------- */
.top{
  flex:0 0 auto;display:flex;align-items:baseline;gap:14px;
  padding:12px 20px;border-bottom:1px solid var(--line);
}
.top h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.015em;}
.top .sub{color:var(--muted);font-size:12.5px;}
.top .p{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--dim);
  max-width:40ch;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}

/* ---------------- main ---------------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;}
.side{grid-column:1;grid-row:1;}
.stage-col{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0;border-left:1px solid var(--line);}
.stage-head{
  flex:0 0 auto;display:flex;align-items:baseline;gap:12px;
  padding:14px 20px 10px;
}
.stage-head h2{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em;}
.stage-head .meta{margin-left:auto;color:var(--dim);font-size:12px;font-family:var(--mono);
  white-space:nowrap;}
.stage{flex:1;min-height:0;overflow:auto;padding:4px 20px 22px;display:flex;flex-direction:column;}
.views{display:flex;flex-direction:column;gap:14px;max-width:840px;width:100%;margin:auto 0;}

/* ---------------- shared pieces ---------------- */
.stack{display:flex;flex-direction:column;gap:6px;}
.row{
  display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:baseline;
  padding:7px 0;border-bottom:1px solid var(--line);
}
.row:first-child{border-top:1px solid var(--line);}
.row .k{font-family:var(--mono);font-size:11.5px;color:var(--muted);}
.row .v{color:var(--ink);font-size:13.5px;}
.row .w{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;}
.row.new .k{color:var(--accent);} .row.new .v{font-weight:600;}
.row .k .sm{font-family:var(--sans);font-size:12px;color:var(--dim);}

.line{font-family:var(--mono);font-size:12px;color:var(--muted);margin:0;line-height:1.65;}
.line b{color:var(--ink);font-weight:600;}
.line .hot{color:var(--hot);}
.line .acc{color:var(--accent);}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.chip{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:6px 10px;font-size:12.5px;line-height:1.35;
}
.chip .cs{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px;}
.chip.on{border-color:var(--accent);}
.chip b{font-family:var(--mono);font-weight:600;}
.sep{color:var(--dim);font-family:var(--mono);font-size:12px;}
.hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);}

.panel{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px;}
.panel > .ph{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:9px;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;align-items:start;}

/* ---------------- figures (inline svg) ---------------- */
.fig{width:100%;height:auto;display:block;overflow:visible;}
.fig text{font-family:var(--mono);font-size:11px;fill:var(--muted);}
.fig .hd{font-family:var(--sans);font-size:12.5px;font-weight:600;fill:var(--ink);}
.fig .sm{font-size:10px;fill:var(--dim);}
.fig .acc{fill:var(--accent);}
.fig .hot{fill:var(--hot);}
.fig .bad{fill:var(--bad);}
.fig .dark{fill:#0d1117;font-weight:600;}
.fig .box{fill:var(--panel);stroke:var(--line);stroke-width:1;}
.fig .boxa{fill:#58a6ff12;stroke:var(--accent);stroke-width:1;}
.fig .boxe{fill:#f851490f;stroke:#f8514966;stroke-width:1;}
.fig .wire{stroke:var(--line);stroke-width:1.2;fill:none;}
.fig .wira{stroke:var(--accent);stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.fig .wird{stroke:var(--accent);stroke-width:1.3;fill:none;stroke-dasharray:5 4;stroke-linecap:round;}
.fig .rail{stroke:var(--dim);stroke-width:1;stroke-dasharray:3 4;}
.fig .cell{fill:#58a6ff;}
.fig .cell.hot{fill:var(--hot);}
.fig .cellm{fill:none;stroke:#2b323a;stroke-width:1;stroke-dasharray:3 3;}
.fig .zone{fill:#58a6ff0e;}
.fig .zonec{fill:#f851490d;}

/* ---------------- tokens ---------------- */
.toks{display:flex;flex-wrap:wrap;gap:4px;}
.tok{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:center;background:var(--panel);}
.tok .tt{padding:5px 8px;font-family:var(--mono);font-size:13px;white-space:pre;background:var(--bg);}
.tok .ti{padding:2px 8px;font-family:var(--mono);font-size:10.5px;color:var(--dim);border-top:1px solid var(--line);}
.tok.hot{border-color:#e3b34166;} .tok.hot .tt{color:var(--hot);}
.tok.sm .tt{font-size:11.5px;padding:4px 7px;} .tok.sm .ti{font-size:10px;padding:2px 6px;}

.strip{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:12px 14px;font-family:var(--mono);font-size:13.5px;line-height:2.1;max-width:74ch;
}
.strip span{border-radius:3px;padding:3px 0;border-bottom:2px solid transparent;}
.strip .t0{background:#58a6ff1c;border-bottom-color:#58a6ff88;}
.strip .t1{background:#e3b3411c;border-bottom-color:#e3b34188;}

/* ---------------- vectors / tables ---------------- */
.vec{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,11px);gap:3px;}
.vec i{width:11px;height:11px;border-radius:2px;background:var(--accent);display:block;}
.etable{display:flex;flex-direction:column;gap:2px;align-items:flex-start;}
.etr{display:flex;gap:2px;}
.etr i{width:10px;height:10px;border-radius:2px;background:#58a6ff26;display:block;}
.etr i.v{background:#58a6ff99;}
.etr.on{border:1px solid var(--accent);border-radius:4px;padding:2px;margin:-3px;}
.etr.on i{background:#58a6ff59;}
.etr.on i.v{background:#58a6ff;}
.vecrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* ---------------- request bubbles ---------------- */
.req{display:grid;grid-template-columns:1fr 268px;gap:16px;align-items:start;}
.reqlist{display:flex;flex-direction:column;gap:6px;}
.bub{
  display:grid;grid-template-columns:72px 1fr 112px;gap:12px;align-items:center;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:9px 12px;
}
.bub .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--dim);}
.bub .tx{font-size:13.5px;}
.bub .tk{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.bub .tk b{display:block;height:8px;border-radius:2px;background:var(--accent);opacity:.4;}
.bub .tk em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap;}
.bub.new{border-color:var(--accent);background:#58a6ff10;}
.bub.new .tk b{opacity:1;background:var(--hot);}
.envex .row{grid-template-columns:1fr auto;gap:10px;}
.envex .row .v{font-family:var(--mono);font-size:12px;}

/* ---------------- probability bars ---------------- */
.bars{display:flex;flex-direction:column;gap:6px;max-width:560px;}
.bars.sm{max-width:none;gap:5px;}
.bar{display:grid;grid-template-columns:112px 1fr 56px;gap:12px;align-items:center;}
.bar .bl{font-family:var(--mono);font-size:12px;white-space:pre;color:var(--muted);}
.bar .bt{height:14px;background:var(--panel2);border-radius:3px;overflow:hidden;}
.bar .bf{display:block;height:100%;background:var(--accent);transform-origin:left center;
  transform:scaleX(0);transition:transform .45s cubic-bezier(.16,1,.3,1);}
.bar .bv{font-family:var(--mono);font-size:11.5px;color:var(--dim);text-align:right;}
.bar.pick .bl{color:var(--hot);font-weight:600;}
.bar.pick .bf{background:var(--hot);}
.bar.cut .bf{background:#2b323a;}

/* ---------------- sequence ---------------- */
.seq{display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
.seq .c{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  font-family:var(--mono);font-size:11.5px;padding:4px 7px;white-space:pre;color:var(--muted);
}
.seq .c.gen{border-color:#e3b34166;color:var(--hot);}
.seq .c.gen sup{font-size:9px;color:var(--dim);margin-left:4px;}

/* ---------------- kv cache strip ---------------- */
.kvstrip{display:flex;flex-wrap:wrap;gap:3px;align-items:center;}
.kvstrip i{width:15px;height:15px;border-radius:2px;display:block;background:#2b323a;}
.kvstrip i.on{background:#58a6ff99;}
.kvstrip i.prompt{background:#58a6ff40;}

/* ---------------- stream frames ---------------- */
.frames{display:flex;flex-direction:column;gap:5px;}
.frame{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:6px 0;
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;}
.frame:first-child{border-top:1px solid var(--line);}
.frame .fk{color:var(--accent);}
.frame .fv{color:var(--muted);white-space:pre-wrap;word-break:break-word;}
.chunks{display:flex;flex-direction:column;gap:7px;}
.chunkrow{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;}
.chunkrow .ct{font-family:var(--mono);font-size:11px;color:var(--dim);}
.chunkrow .cb{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  font-family:var(--mono);font-size:12.5px;padding:6px 10px;}
.chunkrow .cb u{text-decoration:none;color:var(--hot);}
.chunkrow.last .cb{border-color:#e3b341aa;}

/* painted answer */
.paint{
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:14px 16px;font-size:15px;max-width:74ch;
}
.paint .cur{display:inline-block;width:8px;height:16px;background:var(--accent);
  vertical-align:-2px;animation:blink 1.05s steps(1,end) infinite;}
@keyframes blink{50%{opacity:0;}}

/* temperature slider */
.rng{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.rng input[type=range]{flex:1;accent-color:var(--accent);}
.rng .rv{font-family:var(--mono);font-size:12px;color:var(--ink);min-width:34px;text-align:right;}

/* ---------------- narration ---------------- */
.narr{flex:0 0 auto;padding:12px 20px 14px;border-top:1px solid var(--line);}
.narr p{margin:0;font-size:13.5px;color:var(--muted);max-width:90ch;line-height:1.55;}
.narr b{color:var(--ink);font-weight:600;}

/* ---------------- step list ---------------- */
.side{display:flex;flex-direction:column;min-height:0;}
.side .sh{
  flex:0 0 auto;padding:14px 20px 8px;font-family:var(--mono);font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
}
.steps{flex:1;min-height:0;overflow:auto;padding:0 8px 14px;}
.step{
  display:grid;grid-template-columns:20px 1fr;gap:9px;align-items:baseline;width:100%;
  text-align:left;background:transparent;border:0;border-radius:var(--r);
  padding:6px 8px;color:var(--dim);font-size:12.5px;line-height:1.35;
}
.step:hover{color:var(--muted);}
.step .n{font-family:var(--mono);font-size:11px;color:var(--dim);}
.step.on{background:var(--panel);color:var(--ink);font-weight:600;}
.step.on .n{color:var(--accent);}

/* ---------------- controls ---------------- */
.controls{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px 20px;border-top:1px solid var(--line);
}
.ctrl{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 14px;font-size:13px;transition:opacity .15s ease-out;
}
.ctrl:hover{opacity:.8;}
.ctrl:disabled{opacity:.35;cursor:default;}
.ctrl.play{border-color:#2ea04366;color:#3fb950;}
.prog{flex:1;height:3px;background:var(--panel);border-radius:2px;overflow:hidden;}
.prog i{display:block;height:100%;background:var(--accent);transform-origin:left center;
  transform:scaleX(0);transition:transform .3s cubic-bezier(.16,1,.3,1);}
.cnt{font-family:var(--mono);font-size:11.5px;color:var(--dim);white-space:nowrap;}
.disc{font-size:11px;color:var(--dim);white-space:nowrap;}

@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
  .paint .cur{animation:none;}
}
@media (max-width:1000px){
  body{height:auto;overflow:auto;}
  .app{height:auto;min-height:100vh;}
  .main{display:flex;flex-direction:column;}
  .stage{overflow:visible;}
  .side{border-left:0;border-top:1px solid var(--line);}
  .stage-col{border-left:0;}
  .steps{overflow:visible;}
  .disc{display:none;}
  .controls{flex-wrap:wrap;}
}
@media (max-width:760px){
  .top{flex-wrap:wrap;} .top .p{display:none;}
  .req{grid-template-columns:1fr;}
}
@media (max-width:640px){
  .stage-head{padding:12px 14px 8px;} .stage{padding:2px 14px 18px;} .narr{padding:12px 14px 14px;}
  .row{grid-template-columns:78px 1fr;} .row .w{grid-column:2;justify-self:start;}
  .bar{grid-template-columns:88px 1fr 50px;}
  .bub{grid-template-columns:60px 1fr 84px;gap:8px;}
  .stage-head .meta{display:none;}
}
</style>
</head>
<body>

<!-- shared svg marker defs (referenced from every figure in the document) -->
<svg aria-hidden="true" style="position:absolute;width:0;height:0" focusable="false">
  <defs>
    <marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#58a6ff"/></marker>
    <marker id="ar-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#8b949e"/></marker>
    <marker id="ar-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#e3b341"/></marker>
    <marker id="ar-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5"
      orient="auto-start-reverse"><path d="M0,1.4 L9,5 L0,8.6 z" fill="#f85149"/></marker>
  </defs>
</svg>

<div class="app">

  <header class="top">
    <h1>Prompt &rarr; Response</h1>
    <span class="sub">What happens between pressing send and reading the reply.</span>
    <span class="p">Explain why the sky is blue.</span>
  </header>

  <main class="main">
    <section class="stage-col">
      <div class="stage-head">
        <h2 id="title">&mdash;</h2>
        <span class="meta" id="meta"></span>
      </div>
      <div class="stage" id="stage"></div>
      <div class="narr"><p id="narr"></p></div>
    </section>

    <aside class="side">
      <div class="sh">Steps</div>
      <div class="steps" id="steps"></div>
    </aside>
  </main>

  <footer class="controls">
    <button class="ctrl" id="prev">Prev</button>
    <button class="ctrl play" id="play">Play</button>
    <button class="ctrl" id="next">Next</button>
    <button class="ctrl" id="reset">Reset</button>
    <div class="prog"><i id="prog"></i></div>
    <span class="cnt num" id="cnt"></span>
    <span class="disc">Token ids, timings and layer counts are illustrative.</span>
  </footer>
</div>

<script>
/* ---------- the example ---------- */
const PROMPT  = 'Explain why the sky is blue.';
const TOKENS  = [['Explain',39217],[' why',1288],[' the',279],[' sky',15594],
                 [' is',374],[' blue',6691],['.',13]];
const NAMES   = [' Sunlight',' Light',' The',' Blue',' Because'];
const LAYERS  = 24;
const GEN     = [' Sunlight',' is',' scattered',' by',' air',' molecules',' in',' every'];
const CHUNKS  = [' Sunlight',' is scattered',' by air molecules',' in every direction.'];
const MSGS    = [['system','You are a helpful assistant.',7],
                 ['user','What scatters light in the atmosphere?',9],
                 ['assistant','Air molecules, mainly nitrogen and oxygen.',10],
                 ['user','Explain why the sky is blue.',7]];
/* wall-clock budget, one consistent set of numbers */
const T_CONN = 180, T_QUEUE = 120, T_PREFILL = 150, T_DECODE = 280, T_PAINT = 90;
const T_TOTAL = T_CONN + T_QUEUE + T_PREFILL + T_DECODE + T_PAINT;   // 820 ms
const T_FIRST = T_CONN + T_QUEUE + T_PREFILL;                        // 450 ms first token
const PER_TOK = Math.round(T_DECODE / GEN.length);                   // 35 ms / token

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const row = (k, v, w = '', cls = '') =>
  `<div class="row ${cls}"><span class="k">${k}</span><span class="v">${v}</span>` +
  (w ? `<span class="w num">${w}</span>` : '') + `</div>`;
const chips = list => `<div class="chips">` + list.map(c =>
  typeof c === 'string' ? `<span class="chip">${c}</span>` : `<span class="chip">${c[0]}<span class="cs">${c[1]}</span></span>`
).join('') + `</div>`;
const toks = (list, cls = '') => `<div class="toks">` + list.map(([t,id]) =>
  `<div class="tok ${cls}"><div class="tt">${esc(t)}</div><div class="ti">${id}</div></div>`).join('') + `</div>`;
const heat = (seed, n = 14) => {
  let out = '';
  for (let i = 0; i < n; i++){
    const v = Math.abs((Math.sin((i+1)*(seed+1)*12.9898)*43758.5453) % 1);
    out += `<i style="opacity:${(0.2 + v*0.8).toFixed(2)}"></i>`;
  }
  return `<div class="vec">${out}</div>`;
};
const SVG = (vb, body, cls = '') =>
  `<svg class="fig ${cls}" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" role="img">${body}</svg>`;
const txt = (x, y, t, cls = 'sm', anchor = 'start') =>
  `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}">${t}</text>`;
const box = (x, y, w, h, t, sub = '', cls = 'box', tcls = 'hd') =>
  `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>` +
  txt(x + w/2, y + (sub ? h/2 - 1 : h/2 + 4), t, tcls, 'middle') +
  (sub ? txt(x + w/2, y + h/2 + 13, sub, 'sm', 'middle') : '');

/* ---------- sampling math (illustrative but internally consistent) ---------- */
const LOGIT5 = [10.80, 9.96, 9.59, 9.19, 8.78];  // the five candidates
const NTAIL  = 400;                               // rest of the vocabulary, lumped
const REST_MASS = 0.38;                           // what the other ~100k entries hold at T=1
const TAIL = (() => {
  const eTop = LOGIT5.reduce((a,l) => a + Math.exp(l), 0);
  const mass = s => { let sum = 0; for (let k = 1; k <= NTAIL; k++) sum += Math.exp(LOGIT5[4] - s*k); return sum; };
  let lo = 0.002, hi = 1;
  for (let i = 0; i < 90; i++){
    const m = (lo + hi)/2;
    if (mass(m)/(eTop + mass(m)) > REST_MASS) lo = m; else hi = m;
  }
  const s = (lo + hi)/2, out = [];
  for (let k = 1; k <= NTAIL; k++) out.push(LOGIT5[4] - s*k);
  return out;
})();
const ALL_LOGITS = LOGIT5.concat(TAIL);
const probs = T => {
  const e = ALL_LOGITS.map(l => Math.exp(l/T));
  const s = e.reduce((a,b) => a + b, 0);
  return e.map(v => v/s);
};
const P1 = probs(1);
const RANKS = (() => {                        // cumulative distribution at T=1, short tail only
  let c = 0; const out = [];
  for (let i = 0; i < P1.length; i++){ c += P1[i]; out.push(c); if (c >= 0.995) break; }
  return out;
})();
const P_CUT = (() => { let c = 0; for (let i = 0; i < P1.length; i++){ c += P1[i]; if (c >= 0.9) return i + 1; } return P1.length; })();

/* ==================================================================

      ${CHUNKS.map((c,i) => `<div class="chunkrow${i === 3 ? ' last' : ''}">
        <span class="ct num">+${(0.45 + i*0.12).toFixed(2)} s</span>
        <span class="cb">${i ? `<u>${esc(c)}</u>` : esc(c)}</span></div>`).join('')}
    </div>
    <p class="line" style="margin-top:10px">the client never waits for the whole answer: first chunk at <b>0.45 s</b>, last at <b>${(0.45+3*0.12).toFixed(2)} s</b></p>
  </div>
</div>`;

/* 12 — incremental render */
const figRender = () => {
  let acc = '';
  const rows = CHUNKS.map((c,i) => {
    acc += c;
    return `<div class="chunkrow${i === 3 ? ' last' : ''}">
      <span class="ct num">+${(0.45 + i*0.12).toFixed(2)} s</span>
      <span class="cb">${esc(acc.slice(0, acc.length - c.length))}<u>${esc(c)}</u></span></div>`;
  });
  return `<div class="chunks">${rows.join('')}</div>
  <div class="paint">Sunlight is scattered by air molecules, in every direction.<span class="cur"></span></div>
  <p class="line">time to first token is what makes this feel fast (<b>0.45 s</b>), not the total (<b>${(T_TOTAL/1000).toFixed(2)} s</b>) — the app just appends each delta to the message it is already showing</p>`;
};

/* 13 — latency waterfall */
const figWaterfall = () => {
  const rows = [['connection + upload', T_CONN],['gateway + queue', T_QUEUE],['prefill, 7 tokens', T_PREFILL],
                ['decode, 8 tokens', T_DECODE],['stream + paint', T_PAINT]];
  const SX = 140, W = 660/T_TOTAL, BH = 18;
  let out = '', t0 = 0;
  rows.forEach(([label, ms], i) => {
    const x = SX + t0*W, w = ms*W, y = 96 + i*34;
    out += txt(SX - 12, y + 13, label, 'sm', 'end');
    out += `<rect class="box" x="140" y="${y - 4}" width="${w.toFixed(1)}" height="${BH + 8}" rx="3" fill="#58a6ff14" stroke="none"/>`;
    out += `<rect class="${i === 3 ? 'cell hot' : 'cell'}" x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${BH}" rx="3" opacity="${i === 3 ? 0.95 : 0.5}"/>`;
    out += txt(x + 9, y + 13, ms + ' ms', 'dark');
    t0 += ms;
  });
  const xFirst = 140 + T_FIRST*W;
  out += txt(140, 22, 'the request as it happened', 'hd');
  out += txt(800, 22, 'total ' + T_TOTAL + ' ms', 'acc', 'end');
  out += `<line x1="${xFirst.toFixed(1)}" y1="40" x2="${xFirst.toFixed(1)}" y2="${96 + 4*34 + 22}" stroke="#e3b341" stroke-width="1.3" stroke-dasharray="5 4"/>`;
  out += txt(xFirst + 8, 52, 'first token appears at ' + (T_FIRST/1000).toFixed(2) + ' s', 'hot');
  [[0,'0'],[200,'200'],[400,'400'],[600,'600'],[800,'800 ms']].forEach(([ms,l]) =>
    out += txt(140 + ms*W, 96 + 5*34 + 12, l, 'sm', 'middle') +
      `<line class="wire" x1="${(140 + ms*W).toFixed(1)}" y1="${96 + 4*34 + 24}" x2="${(140 + ms*W).toFixed(1)}" y2="${96 + 4*34 + 18}"/>`);
  out += `<line class="wire" x1="140" y1="${96 + 4*34 + 24}" x2="800" y2="${96 + 4*34 + 24}"/>`;
  return SVG('0 0 820 292', out);
};

/* ==================================================================
   steps
   ================================================================== */
const STEPS = [
{
  title:'Chat completion request',
  narr:'The client holds the whole conversation and sends it every time — the model keeps no memory of its own. Model name, the messages array, and a request for a streamed reply go out as one POST.',
  view: figRequest,
  note:'POST /v1/chat/completions · the whole array is re-sent on every turn, so the input side grows as the chat goes on'
},
{
  title:'DNS, TCP, and TLS',
  narr:'Before any model work: name resolution, an encrypted channel, and the upload. Every round trip here is wall-clock time you pay on every call, and it is most of the gap before the first character appears.',
  view: figLadder,
  note:'three round trips before a single token can exist — the connection stays open afterwards, so the reply streams back on it'
},
{
  title:'Gateway: auth, limits, routing',
  narr:'The provider&rsquo;s edge checks the key and quota, applies a rate limit, routes the model name to a cluster, then queues the request for a GPU. A bad key is 401, exhausted quota 429, unknown model 404.',
  view: figGateway,
  note:'queued ~120 ms — serving engines batch several users into one forward pass, so your request waits briefly to be grouped'
},
{
  title:'Byte-pair tokenization',
  narr:'Models do not read characters. A byte-pair tokenizer splits the prompt into the subword pieces it learned during training — frequent words stay whole, rare ones break apart — and each piece maps to an integer id.',
  view: figTokenize,
  note:'the tokenizer works on raw bytes, so any text at all is representable — the cost is more tokens for rarer strings'
},
{
  title:'Embeddings and position encoding',
  narr:'The chat template wraps the turn in special markers, then each id is looked up in an embedding table and becomes a vector of a few thousand numbers. Position information is added so order is known.',
  view: figEmbed,
  note:'&lt;|im_start|&gt;user … &lt;|im_end|&gt;&lt;|im_start|&gt;assistant — from here on the prompt is only numbers'
},
{
  title:'Prefill pass',
  narr:'All prompt tokens go through every layer in one parallel pass. Nothing is generated yet — this pass reads the prompt, fills the KV cache, and is compute-bound, which is why a long prompt costs latency before any words appear.',
  view: figPrefill,
  note:'~150 ms for this prompt · prefill scales with prompt length, and the KV cache it leaves behind is what makes the decode steps cheap'
},
{
  title:'Self-attention and feed-forward',
  narr:'Attention lets every token gather from the tokens before it: score each pair, mask the future, turn scores into weights, blend the values. Then a feed-forward network widens each token four times and projects it back. Both blocks sit inside a residual connection.',
  view: () => `${figAttentionFlow()}
    ${figAttentionMatrix()}
    <p class="line">every token scores itself against the tokens it is allowed to see, masks the future, then blends their values &mdash; the same shape at every one of the ${LAYERS} layers</p>`,
  note:'attention is the only place tokens exchange information · the feed-forward block then transforms each token on its own'
},
{
  title:'Logits and softmax',
  narr:'The final token&rsquo;s vector is multiplied by the output matrix, giving one raw score per vocabulary entry. Softmax turns those scores into probabilities — still nothing generated, just a distribution over every possible next piece.',
  view: figLogits,
  note:'this output matrix is the largest in the model and it runs once per generated token'
},
{
  title:'Temperature and top-p sampling',
  narr:'Settings reshape the distribution before a token is drawn. Temperature sharpens or flattens it; top-p discards the long tail and renormalises what is left; then one token is sampled at random. Temperature 0 is the only setting that repeats itself.',
  view: figSampling,
  note:'drag the temperature to see the whole distribution move — the ranking rarely changes, the confidence does',
  after: () => {
    const r = document.getElementById('trange');
    if (!r) return;
    const box = document.getElementById('distbox'), note = document.getElementById('distnote');
    const upd = () => {
      const T = +r.value, d = probs(T);
      document.getElementById('tval').textContent = T.toFixed(2);
      box.innerHTML = drawDist(T);
      const top = d.slice(0,5), rest = d.slice(5).reduce((a,b) => a + b, 0);
      note.innerHTML = `top token <span class="hot">${(top[0]*100).toFixed(0)}%</span> &middot; ` +
        `four runner-ups ${((top[1]+top[2]+top[3]+top[4])*100).toFixed(1)}% &middot; ` +
        `the other 400 entries ${(rest*100).toFixed(1)}% &rarr; sampled: <span class="hot"> Sunlight</span>`;
    };
    r.addEventListener('input', upd);
    upd();
  }
},
{
  title:'Autoregressive decode loop',
  narr:'The sampled token is appended and fed back in. Each new token needs its own forward pass through all layers, but the KV cache means earlier tokens are never recomputed. Repeat until the model emits an end-of-sequence token.',
  view: () => `<div class="seq">${TOKENS.map(([t]) => `<span class="c">${esc(t)}</span>`).join('')}
      ${GEN.map((t,i) => `<span class="c gen">${esc(t)}<sup>${i+1}</sup></span>`).join('')}
      <span class="c">EOS</span></div>
    ${figDecode()}
    ${figDecodeStrip()}`,
  note:'each generated token costs a full pass over the weights — that is why answer length, not prompt length, dominates the wait'
},
{
  title:'Detokenization and SSE streaming',
  narr:'Each generated id is turned back into its text piece and pushed down the connection opened at the start, usually as server-sent events. The client does not wait for the whole answer, so chunks can end mid-word.',
  view: figStream,
  note:'one HTTP response, many frames — a proxy that buffers will destroy the effect even though the server streamed correctly'
},
{
  title:'Incremental streaming render',
  narr:'The app appends each chunk to the message it is already showing and re-renders. Time-to-first-token is what makes this feel fast; the rest of the time is spent filling the sentence in.',
  view: figRender,
  note:'nothing is re-requested per chunk — the UI just grows one string'
},
{
  title:'End-to-end latency budget',
  narr:'The round trip as your request experienced it. Network and queueing are the fixed cost on every call; prefill scales with the size of your prompt; decode scales with the length of the answer.',
  view: figWaterfall,
  note:'7 prompt tokens, 8 output tokens, 820 ms total — the three fixed costs (connection, queue, paint) are 390 ms of it and never shrink'
}
];

/* ---------- render ---------- */
let current = -1, isPlaying = false, playTimer = null;
const $ = id => document.getElementById(id);

function buildSteps(){
  $('steps').innerHTML = STEPS.map((s,i) =>
    `<button class="step" data-step="${i}"><span class="n num">${i+1}</span><span>${esc(s.title)}</span></button>`).join('');
  document.querySelectorAll('.step').forEach(b =>
    b.addEventListener('click', () => { stopPlay(); show(+b.dataset.step); }));
}

function show(i){
  if (i < 0 || i >= STEPS.length) return;
  current = i;
  const s = STEPS[i];
  $('title').textContent = s.title;
  $('meta').textContent = 'Step ' + (i+1) + ' of ' + STEPS.length;
  $('stage').innerHTML = '<div class="views">' + s.view() + (s.note ? `<p class="line">${s.note}</p>` : '') + '</div>';
  $('stage').scrollTop = 0;
  document.querySelectorAll('.bf[data-w]').forEach(el => requestAnimationFrame(() => {
    el.style.transform = 'scaleX(' + Math.min(1, +el.dataset.w/100) + ')';
  }));
  if (s.after) s.after();
  $('narr').innerHTML = s.narr;
  document.querySelectorAll('.step').forEach(el => {
    const n = +el.dataset.step;
    el.classList.toggle('on', n === i);
  });
  const on = document.querySelector('.step.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block:'nearest' });
  $('cnt').textContent = (i+1) + ' / ' + STEPS.length;
  $('prog').style.transform = 'scaleX(' + ((i+1)/STEPS.length) + ')';
  $('prev').disabled = i === 0;
  $('next').disabled = i === STEPS.length - 1;
}

function stopPlay(){
  isPlaying = false;
  if (playTimer) clearTimeout(playTimer);
  playTimer = null;
  $('play').textContent = 'Play';
}
function next(){ if (current < STEPS.length - 1) show(current + 1); }
function prev(){ if (current > 0) show(current - 1); }
function playLoop(){
  if (!isPlaying) return;
  if (current >= STEPS.length - 1){
    playTimer = setTimeout(() => { if (!isPlaying) return; show(0); playTimer = setTimeout(playLoop, 1500); }, 2400);
    return;
  }
  show(current + 1);
  playTimer = setTimeout(playLoop, 2200);
}
function toggle(){
  if (isPlaying){ stopPlay(); return; }
  isPlaying = true;
  $('play').textContent = 'Pause';
  if (current >= STEPS.length - 1) show(0);
  playTimer = setTimeout(playLoop, 400);
}

/* ---------- wire ---------- */
buildSteps();
$('next').addEventListener('click', () => { stopPlay(); next(); });
$('prev').addEventListener('click', () => { stopPlay(); prev(); });
$('play').addEventListener('click', toggle);
$('reset').addEventListener('click', () => { stopPlay(); show(0); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight'){ stopPlay(); next(); }
  else if (e.key === 'ArrowLeft'){ stopPlay(); prev(); }
  else if (e.key === ' '){ e.preventDefault(); toggle(); }
});
show(0);
</script>
</body>
